name: CI

on:
  pull_request:
  push:
    branches: [main, mlops-production-delivery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Unit, API and integration tests (synthetic fixtures)
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: >
          pytest -m "not performance" --junitxml=reports/junit.xml
          --cov=src --cov-report=xml:reports/coverage.xml --cov-report=term

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python }}
          path: reports/

  docker:
    name: Docker build + container smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Build API image
        run: docker build --target base -t svd-recommender-api:ci .

      - name: Build a demo model on SYNTHETIC data
        run: |
          pip install -r requirements.txt
          python scripts/build_demo_model.py --registry ci-models
          chmod -R a+rX ci-models

      - name: Start container
        run: |
          docker run -d --name svd-api -p 8000:8000 \
            -v "$PWD/ci-models:/app/models:ro" svd-recommender-api:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' svd-api)
            echo "health: $status"; [ "$status" = "healthy" ] && break; sleep 2
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' svd-api)" = "healthy" ]

      - name: Call the API inside the container
        run: |
          curl -fsS http://localhost:8000/health | tee health.json
          curl -fsS "http://localhost:8000/recommendations/1?n=5" | tee recs.json
          curl -fsS "http://localhost:8000/recommendations/999999?n=3" | tee cold.json
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8000/recommendations/0")
          test "$code" = "422"
          python - <<'PY'
          import json
          r = json.load(open("recs.json")); c = json.load(open("cold.json"))
          assert r["strategy"] == "svd" and r["n_returned"] == 5, r
          assert c["strategy"] == "popularity_fallback" and c["cold_start"], c
          print("container inference OK")
          PY

      - name: Container logs
        if: always()
        run: docker logs svd-api

      - name: Stop container
        if: always()
        run: docker rm -f svd-api

  real-data-pipeline:
    name: Full pipeline on MovieLens latest-small
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Train, select on validation, evaluate on test (scratch output)
        env:
          SVD_MODEL_DIR: ci-real-models
          SVD_MLFLOW_ENABLED: "false"
        run: python src/main.py --no-plots --out-dir ci-real-outputs
      - uses: actions/upload-artifact@v4
        with:
          name: real-data-results
          path: ci-real-outputs/
